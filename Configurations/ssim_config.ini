[SSIM_VISUAL_TESTING]
# SSIM Thresholds for different scenarios
strict_threshold = 0.95
moderate_threshold = 0.85
relaxed_threshold = 0.75

# Default threshold
default_threshold = 0.85

# Directories (relative to project root)
baseline_dir = Outputs\ssim_baselines
diff_dir = Outputs\ssim_diffs
pass_dir = Outputs\ssim_pass
temp_dir = Outputs\temp_screenshots

# SSIM calculation parameters
gaussian_blur_kernel = 11
gaussian_blur_sigma = 1.5
ssim_c1 = 0.01
ssim_c2 = 0.03

# Screenshot stabilization
stabilization_wait = 2
element_wait_timeout = 10

# Visualization settings
create_visualizations = true
include_heatmap = true
font_scale = 1
font_thickness = 2